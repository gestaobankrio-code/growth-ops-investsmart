name: Processar Growth Ops

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  processar:
    if: contains(github.event.issue.body, 'GROWTH_OPS_JSON')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Processar issue Growth Ops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/processar-issue.js

      - name: Commitar alterações
        run: |
          git config user.name "growth-ops-bot"
          git config user.email "growth-ops-bot@users.noreply.github.com"
          git add data/*.json exports/*.csv *.md
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
          else
            git commit -m "Processa solicitação Growth Ops"
            git push
          fi
